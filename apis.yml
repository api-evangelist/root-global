aid: root-global
name: Root Global
description: >-
  Root Global is a Berlin-based climate technology company building
  decarbonization infrastructure for the food and beverage supply chain.
  Founded in 2022 and backed by Point Nine, its carbon operating system lets
  food processors, manufacturers, and retailers collect farm-level emissions
  data at scale, calculate corporate and product carbon footprints, and launch
  tailored reduction plans with their farming partners. Results are GUTcert
  certified and SBTi compliant, with the platform supporting operations across
  11+ European countries. Root Global exposes no public developer API surface;
  this profile captures its corporate identity and domain-security posture.
